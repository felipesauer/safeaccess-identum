version: 2

updates:
    # PHP / Composer dependencies
    - package-ecosystem: 'composer'
      directory: '/packages/php'
      schedule:
          interval: 'weekly'
          day: 'monday'
      commit-message:
          prefix: 'chore(php)'
      reviewers:
          - 'felipesauer'
      groups:
          dev-dependencies:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'
          production-dependencies:
              dependency-type: 'production'

    # All npm deps (root tooling + packages/js workspace — single shared lockfile)
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      commit-message:
          prefix: 'chore(deps)'
      reviewers:
          - 'felipesauer'
      # Vitest and its @vitest/* packages are released in lockstep: bumping one
      # alone breaks the install (e.g. @vitest/coverage-v8 5 against vitest 4), so
      # they must travel in one PR. Dependabot resolves overlapping groups by
      # specificity, not by file order, and `npm` (type + update-types rules)
      # outranks this pattern-only group. So minor/patch bumps of both land
      # together in `npm`, and this group only catches what `npm` excludes —
      # majors — which should bring the pair back together once the ignore below
      # is lifted.
      groups:
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
          npm:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'
      # Hold vitest 5: Stryker's vitest runner scores ~8% on it, because every
      # covered mutant survives (stryker-js #6210). Drop these two entries once
      # that issue is fixed and the Stryker runner supports Vitest 5.
      ignore:
          - dependency-name: 'vitest'
            update-types: ['version-update:semver-major']
          - dependency-name: '@vitest/*'
            update-types: ['version-update:semver-major']

    # GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      commit-message:
          prefix: 'chore(ci)'
      reviewers:
          - 'felipesauer'
