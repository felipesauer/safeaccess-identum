name: JS CI

on:
    push:
        branches: [main]
        paths:
            - "packages/js/**"
            - ".github/workflows/js-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "packages/js/**"
            - ".github/workflows/js-ci.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ["22", "24"]

        defaults:
            run:
                working-directory: packages/js

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Install dependencies
              working-directory: .
              run: npm install

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test -- --coverage

            - name: Upload coverage to Codecov
              if: matrix.node == '24'
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  flags: javascript
                  directory: packages/js/coverage

            - name: Typecheck
              if: matrix.node == '24'
              run: npm run typecheck

            - name: Cross-parity tests
              if: matrix.node == '24'
              run: npm run test:parity

            - name: Lint
              if: matrix.node == '24'
              run: npm run lint

            # Mutation testing publishes to the Stryker Dashboard (powers the README badge).
            # Runs only on push to main so the dashboard's `main` report — which the badge
            # reads — stays authoritative; PRs skip it to avoid noise and extra runtime.
            - name: Mutation tests (MSI = 85%)
              if: matrix.node == '24' && github.event_name == 'push'
              run: npm run test:mutation
              env:
                  STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

